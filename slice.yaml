# slice.yaml: BREAD Slice manifest, schema 2.0 (bread-infra spec/slice/slice-manifest-spec.md)
schema_version: '2.0'
id: slice-temp-pico-l4l
name: Slice Template — Pico, Large, 4-Layer
summary: Starter template for BREADS-compatible Slices using Raspberry Pi Pico on a large 4-layer PCB
  (100x145mm).
category: template
status: development
hardware:
  hw_gen_current: 3
  interface: SI1
  pcb:
    layers: 4
    dimensions: 100mm x 145mm
    thickness: 1.6mm
  mounting:
    pattern: slice-L-v0
  mcu:
    form_factor: pico
interfaces:
  host:
    address_default: null
metadata:
  tags:
  - template
  - pico
  - large
  - 4-layer
  - rp2040
